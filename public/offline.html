<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E8EB" />
    <title>Cerquita · sin conexión</title>
    <style>
      html { background: #E7E8EB; color: #22252E; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 22rem; }
      svg { width: 72px; height: 72px; }
      h1 { font-size: 1.6rem; margin: 18px 0 6px; letter-spacing: -0.02em; }
      p { color: #6B6F7B; line-height: 1.5; margin: 0; }
      button { margin-top: 22px; border: 0; border-radius: 16px; background: #22252E; color: #fff; font: 600 1rem system-ui, sans-serif; padding: 12px 22px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="16" r="8" fill="#0F6E6A" /><circle cx="21" cy="16" r="8" fill="#B23A5A" fill-opacity=".9" /></svg>
      <h1>Estás sin internet</h1>
      <p>Cerquita necesita conexión para jugar en vivo con tu pareja. Cuando vuelva el internet, intenta otra vez.</p>
      <button onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
